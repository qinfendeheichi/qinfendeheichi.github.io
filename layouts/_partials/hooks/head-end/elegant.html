{{/* Quiet editorial pass: display serif + muted ink palette + less chrome */}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Muted ink palette — deep navy with a hint of warmth */
  :root {
    --hb-primary-50-rgb: 246 247 250;
    --hb-primary-100-rgb: 234 237 243;
    --hb-primary-200-rgb: 209 215 227;
    --hb-primary-300-rgb: 172 182 203;
    --hb-primary-400-rgb: 126 139 166;
    --hb-primary-500-rgb: 86 99 128;
    --hb-primary-600-rgb: 55 65 92;
    --hb-primary-700-rgb: 43 52 76;
    --hb-primary-800-rgb: 32 40 61;
    --hb-primary-900-rgb: 20 26 44;
    --hb-primary-950-rgb: 10 14 28;
    --hb-secondary-50-rgb: 246 247 250;
    --hb-secondary-100-rgb: 234 237 243;
    --hb-secondary-200-rgb: 209 215 227;
    --hb-secondary-300-rgb: 172 182 203;
    --hb-secondary-400-rgb: 126 139 166;
    --hb-secondary-500-rgb: 86 99 128;
    --hb-secondary-600-rgb: 55 65 92;
    --hb-secondary-700-rgb: 43 52 76;
    --hb-secondary-800-rgb: 32 40 61;
    --hb-secondary-900-rgb: 20 26 44;
    --hb-secondary-950-rgb: 10 14 28;

    --elegant-serif: "Fraunces", "Source Serif Pro", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --elegant-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --elegant-bg: #faf8f3;
    --elegant-rule: rgb(0 0 0 / 0.08);
  }
  :root.dark,
  .dark {
    --elegant-bg: #0f1115;
    --elegant-rule: rgb(255 255 255 / 0.08);
  }

  /* ---------- Typography ---------- */
  html, body { font-family: var(--elegant-sans); }
  h1, h2, h3, h4,
  .resume-biography h1,
  .resume-biography h2,
  .resume-biography h3,
  main [class*="text-3xl"]:is(div, h1, h2, h3) {
    font-family: var(--elegant-serif);
    font-weight: 500 !important;
    letter-spacing: -0.015em;
  }
  .resume-biography h1 { font-weight: 400 !important; letter-spacing: -0.025em; }

  /* Nav brand goes serif, lower-case, smaller */
  header a[href="/"], nav a[href="/"] {
    font-family: var(--elegant-serif);
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  /* ---------- Light-mode background ---------- */
  body { background-color: var(--elegant-bg); }
  main > div > div, main > div { background-color: transparent; }

  /* ---------- Hero: dial back the gradient ---------- */
  .hbx-bg-gradient::before { opacity: 0.55; }
  .dark .hbx-bg-gradient::before { opacity: 0.5; }

  /* ---------- Section titles: hide the icon chip, add hairline rule ---------- */
  .resume-biography .flex.items-center.gap-4 > div.flex-shrink-0.rounded-full {
    display: none;
  }
  .resume-biography .flex.items-center.gap-4 {
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--elegant-rule);
    margin-bottom: 1.5rem !important;
  }
  .resume-biography .flex.items-center.gap-4 > h2,
  .resume-biography .flex.items-center.gap-4 > h3 {
    font-size: 1.35rem !important;
    text-transform: none;
    color: rgb(var(--color-neutral-700));
  }
  .dark .resume-biography .flex.items-center.gap-4 > h2,
  .dark .resume-biography .flex.items-center.gap-4 > h3 {
    color: rgb(var(--color-neutral-200));
  }

  /* ---------- Narrower reading column for bio ---------- */
  .resume-biography .md\:col-span-8 .bio-text { max-width: 42rem; }
  .resume-biography .md\:col-span-8 .prose { max-width: 42rem; }

  /* ---------- Education: flatten cards into timeline rows ---------- */
  .resume-biography .grid.md\:grid-cols-2.xl\:grid-cols-3 {
    display: block !important;
  }
  .resume-biography .grid.md\:grid-cols-2.xl\:grid-cols-3 > div {
    background: none !important;
    box-shadow: none !important;
    border: none !important;
    border-top: 1px solid var(--elegant-rule) !important;
    border-radius: 0 !important;
    padding: 1rem 0 !important;
    backdrop-filter: none !important;
  }
  .resume-biography .grid.md\:grid-cols-2.xl\:grid-cols-3 > div:last-child {
    border-bottom: 1px solid var(--elegant-rule) !important;
  }
  .resume-biography .grid.md\:grid-cols-2.xl\:grid-cols-3 > div > div > div.flex-shrink-0.rounded-full {
    display: none;
  }
  .resume-biography .grid.md\:grid-cols-2.xl\:grid-cols-3 p.text-xl {
    font-family: var(--elegant-serif);
    font-weight: 500 !important;
    font-size: 1.125rem !important;
  }

  /* ---------- CV download: outlined ghost button ---------- */
  .resume-biography a.inline-flex.items-center.px-8.py-4 {
    background: transparent !important;
    color: rgb(var(--color-neutral-900)) !important;
    border: 1px solid rgb(var(--color-neutral-900) / 0.35);
    box-shadow: none !important;
    padding: 0.6rem 1.1rem !important;
    font-size: 0.95rem !important;
    font-weight: 500 !important;
    border-radius: 0.4rem !important;
    transform: none !important;
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .resume-biography a.inline-flex.items-center.px-8.py-4:hover {
    background: rgb(var(--color-neutral-900)) !important;
    color: #fff !important;
    transform: none !important;
    box-shadow: none !important;
  }
  .dark .resume-biography a.inline-flex.items-center.px-8.py-4 {
    color: rgb(var(--color-neutral-100)) !important;
    border-color: rgb(var(--color-neutral-100) / 0.35);
  }
  .dark .resume-biography a.inline-flex.items-center.px-8.py-4:hover {
    background: rgb(var(--color-neutral-100)) !important;
    color: rgb(var(--color-neutral-900)) !important;
  }

  /* ---------- Interests pills: strip color, keep hairline ---------- */
  .resume-biography .flex.flex-wrap.gap-3 > span {
    background: transparent !important;
    color: rgb(var(--color-neutral-700)) !important;
    border: 1px solid var(--elegant-rule) !important;
    font-weight: 400 !important;
  }
  .dark .resume-biography .flex.flex-wrap.gap-3 > span {
    color: rgb(var(--color-neutral-200)) !important;
  }

  /* ---------- Social icons: smaller, no hover lift ---------- */
  .resume-biography a.w-12.h-12 {
    width: 2.25rem !important;
    height: 2.25rem !important;
    box-shadow: none !important;
    background: transparent !important;
    border-color: var(--elegant-rule) !important;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .resume-biography a.w-12.h-12:hover {
    transform: none !important;
    box-shadow: none !important;
    color: rgb(var(--color-neutral-900));
    border-color: rgb(var(--color-neutral-900) / 0.4);
  }
  .resume-biography a.w-12.h-12 svg { width: 1.05rem !important; height: 1.05rem !important; }
  .dark .resume-biography a.w-12.h-12:hover {
    color: rgb(var(--color-neutral-100));
    border-color: rgb(var(--color-neutral-100) / 0.4);
  }

  /* ---------- Publications list (citation view) ---------- */
  /* Give it generous breathing room, make venue bolded names feel editorial */
  main .container ol, main .container ul { padding-left: 0; }
  main .container li + li, main .container p + p { margin-top: 1.1rem; }

  /* ---------- Collection section title: match section-title style ---------- */
  .mb-6.text-3xl.font-bold {
    font-family: var(--elegant-serif) !important;
    font-weight: 500 !important;
    font-size: 1.75rem !important;
    text-align: left;
    width: 100%;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--elegant-rule);
    color: rgb(var(--color-neutral-800));
    letter-spacing: -0.015em;
  }
  .dark .mb-6.text-3xl.font-bold {
    color: rgb(var(--color-neutral-100));
  }
  /* Loosen the centered flex container around collection titles so title aligns with list below */
  .flex.flex-col.items-center.max-w-prose.mx-auto {
    align-items: stretch;
    max-width: 48rem;
  }

  /* ---------- Soften global shadows a touch ---------- */
  .shadow-xl, .shadow-2xl { box-shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 4px 12px rgb(0 0 0 / 0.05) !important; }

  /* ---------- Smooth focus underline on nav links ---------- */
  nav a { transition: color 0.2s ease; }

  /* ---------- Tighten left column so hero height matches shorter right column ---------- */
  .resume-biography .md\:col-span-4 {
    gap: 1rem !important;
  }
  .resume-biography .md\:col-span-4 > * + * {
    margin-top: 0 !important;
  }
  .resume-biography .md\:col-span-4 .space-y-3 > * + * {
    margin-top: 0.25rem !important;
  }
  .resume-biography h1 {
    font-size: 2.25rem !important;
    line-height: 1.1 !important;
  }
  @media (min-width: 1024px) {
    .resume-biography h1 { font-size: 2.5rem !important; }
  }
  .resume-biography .text-2xl.font-semibold {
    font-size: 1rem !important;
    font-weight: 500 !important;
    color: rgb(var(--color-neutral-700)) !important;
  }
  .dark .resume-biography .text-2xl.font-semibold {
    color: rgb(var(--color-neutral-300)) !important;
  }
  /* Vertically align the two hero columns so any residual gap sits at top & bottom equally */
  .resume-biography .grid.grid-cols-1.md\:grid-cols-12 {
    align-items: center;
  }

  /* ---------- Pull sections closer together ---------- */
  .hbb-section {
    padding-top: 1.5rem !important;
    padding-bottom: 2rem !important;
  }
  /* The biography block has its own internal py-* padding; trim the wrapper harder */
  .blox-resume-biography-3 { padding-top: 0 !important; padding-bottom: 0 !important; }
  .resume-biography { padding-bottom: 2.5rem !important; }

  /* ---------- Kill the big mt-16/mt-20 gap under the Publications title ---------- */
  .mt-16.sm\:mt-20.container.max-w-3xl.w-full {
    margin-top: 0.75rem !important;
  }

  /* ---------- Standalone Education list (markdown block) ---------- */
  .elegant-education {
    list-style: none;
    padding: 0;
    margin: 0;
    width: 100%;
    max-width: 48rem;
  }
  .elegant-education li {
    display: flex;
    flex-direction: column;
    padding: 1rem 0;
    border-top: 1px solid var(--elegant-rule);
  }
  .elegant-education li:last-child { border-bottom: 1px solid var(--elegant-rule); }
  .elegant-ed-area {
    font-family: var(--elegant-serif);
    font-weight: 500;
    font-size: 1.125rem;
    color: rgb(var(--color-neutral-900));
  }
  .elegant-ed-inst {
    color: rgb(var(--color-neutral-600));
    margin-top: 0.1rem;
  }
  .dark .elegant-ed-area { color: rgb(var(--color-neutral-100)); }
  .dark .elegant-ed-inst { color: rgb(var(--color-neutral-400)); }
</style>
